[project]
name = "interviewx-ai-service"
version = "0.1.0"
description = "FastAPI AI & Data Processing Service for InterviewX DataHub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "PyMuPDF>=1.24.11",
    "python-docx>=1.1.2",
    "pandas>=2.2.3",
    "polars>=1.9.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "minio>=7.2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
