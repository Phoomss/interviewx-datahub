version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: interviewx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-interviewx_datahub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewx} -d ${POSTGRES_DB:-interviewx_datahub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 2. Redis (Queue & Caching)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: interviewx-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 3. MinIO Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: interviewx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 4. MinIO Bucket Initialization (One-shot)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: interviewx-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_RAW_DOCUMENTS:-raw-documents};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_DATASET_EXPORTS:-dataset-exports};
      echo 'MinIO buckets initialized successfully.';
      exit 0;
      "
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 5. MLflow Tracking Server
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: interviewx-mlflow
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "5001:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root s3://${MINIO_BUCKET_DATASET_EXPORTS:-dataset-exports}/mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    networks:
      - interviewx-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  interviewx-network:
    driver: bridge
