services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: interviewx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-interviewx_datahub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewx} -d ${POSTGRES_DB:-interviewx_datahub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 2. Redis (Queue & Caching)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: interviewx-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 3. S3-Compatible Object Storage (SeaweedFS)
  # ---------------------------------------------------------------------------
  minio:
    # MinIO images have been withdrawn from public registries. SeaweedFS exposes
    # the same S3 API used by the application and is actively maintained.
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    container_name: interviewx-minio
    restart: unless-stopped
    command: mini -dir=/data -admin.password=${MINIO_ROOT_PASSWORD:-minioadmin}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:8333"
      - "${MINIO_CONSOLE_PORT:-9001}:23646"
    volumes:
      - miniodata:/data
    networks:
      - interviewx-network

  # Default buckets are created by the backend's S3 client at startup.

  # ---------------------------------------------------------------------------
  # 4. MLflow Tracking Server
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: interviewx-mlflow
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:8333
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "5001:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root s3://${MINIO_BUCKET_DATASET_EXPORTS:-dataset-exports}/mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 5. AI Service (FastAPI)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: interviewx-ai-service
    restart: unless-stopped
    ports:
      - "${PORT_AI_SERVICE:-8000}:8000"
    environment:
      MINIO_ENDPOINT: minio:8333
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-interviewx_internal_service_secret_key_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - minio
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 6. Backend Core API (NestJS)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: interviewx-backend
    restart: unless-stopped
    ports:
      - "${PORT_BACKEND:-4000}:4000"
    environment:
      PORT_BACKEND: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewx}:${POSTGRES_PASSWORD:-interviewx_secret}@postgres:5432/${POSTGRES_DB:-interviewx_datahub}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 8333
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AI_SERVICE_URL: http://ai-service:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_32chars}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-interviewx_internal_service_secret_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - interviewx-network

  # ---------------------------------------------------------------------------
  # 7. Frontend Web App (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: interviewx-frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - backend
    networks:
      - interviewx-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  interviewx-network:
    driver: bridge
